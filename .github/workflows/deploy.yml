name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - aws-stg # Staging deployment (automatic)
  workflow_dispatch: # Manual trigger
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  AWS_REGION: us-east-1

jobs:
  # Job 1: Code Quality Checks
  quality-checks:
    uses: ./.github/workflows/quality-checks.yml
    with:
      node-version: '20'

  # Job 2: Deploy to Staging (Automatic)
  deploy-staging:
    needs: quality-checks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/aws-stg'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate deployment package
        run: |
          mkdir -p .ebextensions
          cp -r .next .ebextensions/
          cp -r public .ebextensions/
          cp package*.json .ebextensions/
          cp next.config.ts .ebextensions/
          cd .ebextensions
          zip -r ../deployment.zip .
          cd ..

      - name: Deploy to Staging
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name gymFuel \
            --version-label "staging-v${{ github.run_number }}-${{ github.sha }}" \
            --source-bundle S3Bucket="${{ secrets.AWS_S3_BUCKET }},S3Key=deployments/staging-deployment.zip"

          aws elasticbeanstalk update-environment \
            --environment-name staging-gymFuel \
            --version-label "staging-v${{ github.run_number }}-${{ github.sha }}"

      - name: Wait for deployment
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-names staging-gymFuel

      - name: Health check staging
        run: |
          sleep 60
          curl -f https://staging-gymfuel.elasticbeanstalk.com/health || exit 1

  # Job 3: Check Staging Health (Required for Production)
  check-staging-health:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    outputs:
      staging-healthy: ${{ steps.health-check.outputs.healthy }}

    steps:
      - name: Check staging health
        id: health-check
        run: |
          # Check if staging environment is healthy
          STAGING_STATUS=$(aws elasticbeanstalk describe-environments \
            --environment-names staging-gymFuel \
            --query 'Environments[0].Health' \
            --output text)

          if [ "$STAGING_STATUS" = "Green" ]; then
            echo "healthy=true" >> $GITHUB_OUTPUT
            echo "✅ Staging environment is healthy"
          else
            echo "healthy=false" >> $GITHUB_OUTPUT
            echo "❌ Staging environment is not healthy (Status: $STAGING_STATUS)"
            exit 1
          fi

      - name: Test staging application
        run: |
          # Additional health check via HTTP
          curl -f https://staging-gymFuel.elasticbeanstalk.com/health || exit 1
          echo "✅ Staging application is responding"

  # Job 4: Manual Production Deployment (Only if staging is healthy)
  deploy-production:
    needs: [quality-checks, check-staging-health]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && 
      github.event.inputs.environment == 'production' &&
      needs.check-staging-health.outputs.staging-healthy == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate deployment package
        run: |
          mkdir -p .ebextensions
          cp -r .next .ebextensions/
          cp -r public .ebextensions/
          cp package*.json .ebextensions/
          cp next.config.ts .ebextensions/
          cd .ebextensions
          zip -r ../deployment.zip .
          cd ..

      - name: Deploy to Production
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name gymFuel \
            --version-label "prod-v${{ github.run_number }}-${{ github.sha }}" \
            --source-bundle S3Bucket="${{ secrets.AWS_S3_BUCKET }},S3Key=deployments/prod-deployment.zip"

          aws elasticbeanstalk update-environment \
            --environment-name production-gymFuel \
            --version-label "prod-v${{ github.run_number }}-${{ github.sha }}"

      - name: Wait for deployment
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-names production-gymFuel

      - name: Health check production
        run: |
          sleep 60
          curl -f https://production-gymFuel.elasticbeanstalk.com/health || exit 1

  # Job 5: Fail if staging is unhealthy (for production deployment)
  fail-if-staging-unhealthy:
    needs: [quality-checks, check-staging-health]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && 
      github.event.inputs.environment == 'production' &&
      needs.check-staging-health.outputs.staging-healthy == 'false'

    steps:
      - name: Fail deployment
        run: |
          echo "❌ Cannot deploy to production: Staging environment is unhealthy"
          echo "Please fix staging environment before deploying to production"
          exit 1
